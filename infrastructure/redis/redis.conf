# ============================================================
# OneBook Redis 7 Configuration
# Optimised for Cache-Aside / Warm Cache pattern.
# ============================================================

# ─── Network ────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── Memory ─────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ─── Persistence (AOF preferred for durability) ─────────────
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── Logging ────────────────────────────────────────────────
loglevel notice

# ─── Performance ────────────────────────────────────────────
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
