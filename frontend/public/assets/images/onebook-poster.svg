<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <!-- Background -->
  <rect width="400" height="250" fill="#1a2332"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="url(#grid)"/>
  
  <!-- Glow Effects -->
  <defs>
    <radialGradient id="emeraldGlow" cx="30%" cy="40%">
      <stop offset="0%" stop-color="rgba(0,217,165,0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="70%" cy="60%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#emeraldGlow)"/>
  <rect width="400" height="250" fill="url(#purpleGlow)"/>
  
  <!-- Dashboard Mock -->
  <g transform="translate(30, 30)">
    <!-- Top Bar -->
    <rect width="340" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
    <circle cx="15" cy="15" r="5" fill="#00d9a5"/>
    <rect x="30" y="10" width="60" height="10" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="250" y="10" width="80" height="10" rx="3" fill="rgba(255,255,255,0.08)"/>
    
    <!-- Sidebar -->
    <rect y="40" width="70" height="140" rx="6" fill="rgba(255,255,255,0.03)"/>
    <rect x="10" y="55" width="50" height="8" rx="2" fill="rgba(0,217,165,0.3)"/>
    <rect x="10" y="75" width="45" height="6" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="10" y="93" width="40" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="10" y="111" width="48" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="10" y="129" width="35" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>
    
    <!-- Main Content Area -->
    <g transform="translate(80, 40)">
      <!-- Stats Row -->
      <rect width="80" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
      <rect x="90" width="80" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
      <rect x="180" width="80" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
      
      <!-- Chart Area -->
      <rect y="55" width="260" height="85" rx="6" fill="rgba(255,255,255,0.03)"/>
      
      <!-- Chart Line -->
      <path d="M 20 110 L 50 95 L 80 100 L 110 85 L 140 90 L 170 75 L 200 80 L 230 65" 
            stroke="#00d9a5" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 20 110 L 50 95 L 80 100 L 110 85 L 140 90 L 170 75 L 200 80 L 230 65 L 230 130 L 20 130 Z" 
            fill="url(#chartGradient)" opacity="0.3"/>
      
      <!-- Chart Gradient -->
      <defs>
        <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00d9a5"/>
          <stop offset="100%" stop-color="transparent"/>
        </linearGradient>
      </defs>
    </g>
  </g>
  
  <!-- OneBook Logo Watermark -->
  <text x="200" y="235" text-anchor="middle" fill="rgba(255,255,255,0.15)" 
        font-family="system-ui" font-size="14" font-weight="600">
    OneBook Dashboard
  </text>
</svg>
