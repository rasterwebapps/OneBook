name: Sync Documentation

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'docs/requirements/active/**.md'
      - 'backend/src/**'
      - 'frontend/src/**'
  pull_request:
    paths:
      - 'docs/requirements/active/**.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-requirements:
    name: Validate Requirement Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/automation/package.json

      - name: Install documentation dependencies
        working-directory: docs/automation
        run: npm install

      - name: Validate requirement files
        working-directory: docs/automation
        run: npm run validate
        id: validate

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: docs/automation/
          retention-days: 7

  generate-documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: validate-requirements
    # Only generate and commit on non-PR pushes to avoid double-commits
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/automation/package.json

      - name: Install documentation dependencies
        working-directory: docs/automation
        run: npm install

      - name: Generate BRD
        working-directory: docs/automation
        run: npm run generate-brd

      - name: Generate FRD
        working-directory: docs/automation
        run: npm run generate-frd

      - name: Generate TRD
        working-directory: docs/automation
        run: npm run generate-trd

      - name: Generate RTM
        working-directory: docs/automation
        run: npm run generate-rtm

      - name: Update Requirements Index
        working-directory: docs/automation
        run: npm run update-index

      - name: Generate Data Dictionary
        working-directory: docs/automation
        run: npm run generate-data-dict

      - name: Check for documentation changes
        id: check-changes
        run: |
          git diff --quiet docs/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push documentation updates
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add docs/business/BRD.md
          git add docs/business/FRD.md
          git add docs/business/TRD.md
          git add docs/requirements/RTM.md
          git add docs/requirements/requirements-index.md
          git add docs/technical/data-dictionary.md
          
          # Only commit if there are staged changes
          git diff --cached --quiet || git commit -m "docs: auto-generate documentation from requirements [skip ci]

          Auto-generated by sync-documentation workflow.
          Triggered by: ${{ github.event_name }} on ${{ github.ref }}
          
          Files updated:
          - docs/business/BRD.md
          - docs/business/FRD.md
          - docs/business/TRD.md
          - docs/requirements/RTM.md
          - docs/requirements/requirements-index.md
          - docs/technical/data-dictionary.md
          
          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          
          git push

  check-coverage:
    name: Check Documentation Coverage
    runs-on: ubuntu-latest
    needs: validate-requirements
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check all REQ files have corresponding BRD/FRD references
        run: |
          echo "📊 Documentation Coverage Check"
          echo "================================"
          
          REQ_COUNT=$(find docs/requirements/active -name "REQ-*.md" | wc -l)
          echo "✓ Requirement files found: $REQ_COUNT"
          
          # Check that each REQ file has required fields
          ERRORS=0
          for f in docs/requirements/active/REQ-*.md; do
            if [ -f "$f" ]; then
              FILENAME=$(basename "$f")
              
              # Check Status field
              if ! grep -q "^\*\*Status:\*\*" "$f"; then
                echo "❌ Missing Status in $FILENAME"
                ERRORS=$((ERRORS + 1))
              fi
              
              # Check Priority field
              if ! grep -q "^\*\*Priority:\*\*" "$f"; then
                echo "❌ Missing Priority in $FILENAME"
                ERRORS=$((ERRORS + 1))
              fi
              
              # Check Owner field
              if ! grep -q "^\*\*Owner:\*\*" "$f"; then
                echo "❌ Missing Owner in $FILENAME"
                ERRORS=$((ERRORS + 1))
              fi
              
              # Check Gherkin scenarios
              if ! grep -q "Scenario:" "$f"; then
                echo "⚠️  No Gherkin Scenario in $FILENAME"
              fi
              
              echo "✓ $FILENAME — OK"
            fi
          done
          
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "❌ Coverage check failed with $ERRORS error(s)"
            exit 1
          fi
          
          echo ""
          echo "✅ All $REQ_COUNT requirement files pass coverage check"

      - name: Verify RTM is up to date
        run: |
          if [ ! -f "docs/requirements/RTM.md" ]; then
            echo "❌ RTM.md is missing!"
            exit 1
          fi
          echo "✅ RTM.md exists"
          
          RTM_REQS=$(grep -c "REQ-" docs/requirements/RTM.md || true)
          echo "✓ RTM references $RTM_REQS requirement entries"

      - name: Verify business documents exist
        run: |
          DOCS=(
            "docs/business/BRD.md"
            "docs/business/FRD.md"
            "docs/business/TRD.md"
            "docs/business/user-stories.md"
            "docs/business/glossary.md"
            "docs/technical/data-dictionary.md"
            "docs/technical/api-contracts.md"
            "docs/technical/workflow-diagrams.md"
            "docs/user/user-manual.md"
            "docs/user/feature-catalog.md"
            "docs/user/keyboard-shortcuts.md"
          )
          
          ALL_OK=true
          for doc in "${DOCS[@]}"; do
            if [ -f "$doc" ]; then
              SIZE=$(wc -c < "$doc")
              echo "✅ $doc ($SIZE bytes)"
            else
              echo "❌ MISSING: $doc"
              ALL_OK=false
            fi
          done
          
          if [ "$ALL_OK" = false ]; then
            echo ""
            echo "❌ Some documentation files are missing!"
            exit 1
          fi
          
          echo ""
          echo "✅ All documentation files present"
