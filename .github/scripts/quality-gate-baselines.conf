# Quality Gate Baselines — OneBook
# =================================
# This file records the known counts of pre-existing quality violations.
# The validate-quality-gates.sh script uses these baselines to only fail
# on NEW violations (regression detection), not pre-existing ones.
#
# Format: GATE_NAME=count
# Update these baselines only when pre-existing violations are intentionally fixed.
#
# Last updated: 2026-04-04

# Pre-existing DTO violations (JPA entities in controller return types)
# These exist in controllers from M1-M10 that were built before DTO enforcement.
# New code MUST use DTOs. Reducing this number is encouraged.
DTO_VIOLATIONS_BASELINE=125

# Pre-existing missing backend test files
# Some services from early milestones don't have dedicated test files.
MISSING_BACKEND_TESTS_BASELINE=3

# Pre-existing missing frontend spec files
MISSING_FRONTEND_SPECS_BASELINE=8

# Pre-existing i18n violations (hardcoded strings in templates)
I18N_VIOLATIONS_BASELINE=1

# Pre-existing RLS issues (tables with tenant_id but no RLS in the same migration)
# V6__ingestion_layer.sql has 5 tables without RLS policies
RLS_VIOLATIONS_BASELINE=5
